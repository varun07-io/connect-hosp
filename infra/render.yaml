# Render Blueprint — deploys the whole POC (API + static frontend + Postgres).
# Dashboard: "New +" -> "Blueprint" -> point at this repo -> Render reads this file.
#
# ---------------------------------------------------------------------------
# WHAT YOU MUST DO BY HAND (Render can't wire cross-service secrets for you)
# ---------------------------------------------------------------------------
#  1. `connect-hospital-postgres` -> Environment -> copy the generated
#     POSTGRES_PASSWORD.
#  2. `connect-hospital-api` -> Environment -> set:
#       DATABASE_URL = postgresql://connect:<password>@connect-hospital-postgres:5432/connect_hospital
#     (services in one blueprint reach each other by service name.)
#  3. `connect-hospital-api` -> Environment -> set WEB_ORIGIN and API_PUBLIC_URL
#     to the two public URLs Render assigns, then redeploy. WEB_ORIGIN is the
#     CORS allow-list, so the frontend cannot call the API until it is correct.
#  4. `connect-hospital-web` -> Environment -> set VITE_API_URL to the API's
#     URL, then "Clear build cache & deploy" (Vite bakes it in at build time,
#     so a plain restart will NOT pick up a change here).
#  5. Seed the demo data once, from the API service's Shell tab:
#       npm run db:seed --workspace apps/api
#     (Schema migration runs automatically via preDeployCommand below.)
#
# ---------------------------------------------------------------------------
# COST / PLAN NOTE
# ---------------------------------------------------------------------------
# Both paid services below are `starter`. That is deliberate:
#   * Render's FREE web services sleep after ~15 min idle and take ~50s to wake
#     — which is exactly the "why is it loading so long" problem, in front of a
#     client. Starter never sleeps.
#   * Persistent disks (needed for self-managed Postgres) require a paid plan.
# Static sites are free. Expect roughly $7/mo per paid service.
# To cut cost between demos, suspend the services rather than downgrading.

services:
  - type: web
    name: connect-hospital-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    # Applies committed migrations before each new version goes live.
    preDeployCommand: npx prisma migrate deploy --schema prisma/schema.prisma
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      # --- Demo auth ---------------------------------------------------------
      # This deployment has no Firebase project, so the dev-login switcher is the
      # ONLY way in. Both flags are required together; see apps/api/src/env.ts.
      # Set BOTH to false the moment real Firebase auth is configured.
      - key: DEV_AUTH_BYPASS
        value: "true"
      - key: ALLOW_INSECURE_DEMO_AUTH
        value: "true"
      # -----------------------------------------------------------------------
      - key: WEB_ORIGIN
        sync: false # manual step 3 — the static site's URL (CORS allow-list)
      - key: API_PUBLIC_URL
        sync: false # manual step 3 — this service's own URL
      - key: DATABASE_URL
        sync: false # manual step 2
      - key: FILE_SIGNING_SECRET
        generateValue: true
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false

  - type: web
    name: connect-hospital-web
    runtime: static
    buildCommand: npm install && npm run build --workspace packages/shared && npm run build --workspace apps/web
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false # manual step 4 — the API's URL. Baked in at BUILD time.
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
    routes:
      # SPA fallback: every client-side route must serve index.html, or a
      # deep link / refresh on /search would 404.
      - type: rewrite
        source: /*
        destination: /index.html

  # Self-managed Postgres on a persistent disk, per the POC cost plan — note
  # there are NO automated backups here (unlike Render's managed Postgres
  # add-on). Schedule your own pg_dump before this holds anything you can't
  # afford to lose.
  - type: pserv
    name: connect-hospital-postgres
    runtime: image
    image:
      url: docker.io/library/postgres:16-alpine
    plan: starter
    disk:
      name: connect-hospital-pgdata
      mountPath: /var/lib/postgresql/data
      sizeGB: 1
    envVars:
      - key: POSTGRES_USER
        value: connect
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: POSTGRES_DB
        value: connect_hospital
      - key: PGDATA
        value: /var/lib/postgresql/data/pgdata
